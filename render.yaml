services:
  - type: web
    name: hajimi-patched
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: PASSWORD
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: FAKE_STREAMING
        value: "false"
      - key: API_KEY_DAILY_LIMIT
        value: "1000"
      - key: CACHE_EXPIRY_TIME
        value: "60"
      - key: ENABLE_STORAGE
        value: "false"
      - key: SHOW_UPSTREAM_ERROR
        value: "true"
      - key: KEY_COOLDOWN_BASE
        value: "15"
      - key: KEY_COOLDOWN_MAX
        value: "300"
